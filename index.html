<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SmartTask AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Google API Scripts for Drive Upload -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Prompt', 'sans-serif'],
              handwriting: ['Kalam', 'cursive'],
            },
            colors: {
              primary: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95',
              }
            },
            animation: {
              'wiggle': 'wiggle 0.5s ease-in-out infinite',
              'bounce-short': 'bounce-short 0.3s ease-in-out 1',
              'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'slide-up': 'slide-up 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
              'book-enter': 'bookEnter 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards',
              'page-enter': 'pageEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
              'page-exit': 'pageExit 0.4s cubic-bezier(0.4, 0, 1, 1) forwards',
            },
            keyframes: {
              wiggle: {
                '0%, 100%': { transform: 'rotate(-3deg)' },
                '50%': { transform: 'rotate(3deg)' },
              },
              'bounce-short': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' },
              },
              pop: {
                '0%': { transform: 'scale(0.95)', opacity: 0 },
                '100%': { transform: 'scale(1)', opacity: 1 },
              },
              'slide-up': {
                '0%': { transform: 'translateY(100%)' },
                '100%': { transform: 'translateY(0)' },
              },
              bookEnter: {
                '0%': { transform: 'translateY(50px) rotateX(-10deg) scale(0.95)', opacity: '0' },
                '100%': { transform: 'translateY(0) rotateX(0) scale(1)', opacity: '1' }
              },
              pageEnter: {
                '0%': { opacity: 0, transform: 'translateY(20px) scale(0.98)' },
                '100%': { opacity: 1, transform: 'translateY(0) scale(1)' }
              },
              pageExit: {
                '0%': { opacity: 1, transform: 'translateY(0) scale(1)' },
                '100%': { opacity: 0, transform: 'translateY(-20px) scale(0.98)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .duk-dik:hover { animation: wiggle 0.4s ease-in-out; }
      
      /* 3D Page Flip Animation Classes */
      .perspective-container { perspective: 2000px; }
      .page-content {
        transform-style: preserve-3d;
        transform-origin: left center;
        backface-visibility: hidden;
        transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
      }
      .page-turning-next { animation: turnPageNext 0.6s forwards; }
      .page-turning-prev { animation: turnPagePrev 0.6s forwards; }

      @keyframes turnPageNext {
        0% { transform: rotateY(0deg); opacity: 1; }
        50% { transform: rotateY(-90deg); opacity: 0.5; }
        100% { transform: rotateY(0deg); opacity: 1; }
      }
      @keyframes turnPagePrev {
        0% { transform: rotateY(0deg); opacity: 1; }
        50% { transform: rotateY(90deg); opacity: 0.5; }
        100% { transform: rotateY(0deg); opacity: 1; }
      }
      
      /* --- Rich Text Editor Alignment Fixes --- */
      
      /* 1. Base settings to match 32px (2rem) background lines */
      .editor-content {
         outline: none;
         font-size: 1.125rem; /* 18px font size looks good on 32px lines */
         line-height: 2rem;   /* Exactly 32px to match bg */
         min-height: 300px;
         /* Push text down slightly to sit on the baseline */
         padding-top: 5px; 
      }

      /* 2. Reset block elements to prevent rhythm breaking */
      .editor-content p, 
      .editor-content div, 
      .editor-content li { 
        margin: 0; 
        padding: 0;
        line-height: 2rem; /* Force inheritance */
      }
      
      /* 3. List Styling - Full Width & Indentation */
      .editor-content ul, 
      .editor-content ol { 
        margin: 0; 
        padding: 0;
        padding-left: 2rem; /* Indent the bullets */
        width: 100%; /* Ensure full width */
      }

      /* Fix for list markers breaking line height */
      .editor-content li {
        margin-bottom: 0;
        /* Ensure list item content aligns */
      }

      .editor-content ul { list-style-type: disc; }
      .editor-content ol { list-style-type: decimal; }

      /* 4. Indentation for paragraphs (optional, but looks nice on paper) */
      .editor-content p {
         text-indent: 0; /* Let user decide indent with space or tab, or set to 2rem if forced */
      }
      
      .editor-content b { font-weight: 700; color: #334155; }
      
      /* Active Toolbar Button Style */
      .toolbar-btn-active {
        background-color: #e0e7ff; 
        color: #4f46e5; 
        box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
        transform: translateY(1px);
        border: 1px solid #c7d2fe;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "uuid": "https://esm.sh/uuid@^13.0.0",

    "react": "https://esm.sh/react@^19.2.4",

    "@capacitor/preferences": "https://esm.sh/@capacitor/preferences@^6.0.0"
  }
}
</script>

</head>
